<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LangChain & LangGraph Agentic Workflow</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="dark-theme">
    <!-- Dynamic Interactive Background Particles -->
    <div class="bg-canvas-wrapper">
        <canvas id="bg-network-canvas"></canvas>
        <div class="glow-orb orb-top"></div>
        <div class="glow-orb orb-bottom"></div>
    </div>

    <div class="dashboard-wrapper">
        <!-- Header -->
        <header class="top-navbar">
            <div class="brand">
                <div class="brand-logo">
                    <i class="fa-solid fa-cubes-stacked"></i>
                </div>
                <div class="brand-details">
                    <h2>LangChain & LangGraph Agent</h2>
                    <span class="status-badge"><span class="pulse-dot"></span> Sequential Workflow Engine</span>
                </div>
            </div>
            <div class="nav-actions">
                <div class="metrics">
                    <span class="metric-label">Engine:</span>
                    <span class="metric-value">v2.4 Active</span>
                </div>
            </div>
        </header>

        <!-- Interactive User Prompt Input Area (Interactive Agent Launch) -->
        <section class="prompt-input-card">
            <div class="input-header">
                <label for="user-prompt-input"><i class="fa-solid fa-terminal"></i> Enter Prompt / Goal for the Agent Workflows</label>
            </div>
            <div class="input-box-wrapper">
                <textarea id="user-prompt-input" rows="2" placeholder="e.g., Analyze market trends for AI startups and generate a summary report..."></textarea>
                <button id="execute-agent-btn" class="glow-btn">
                    <i class="fa-solid fa-paper-plane"></i> Run Agent Pipeline
                </button>
            </div>
        </section>

        <!-- Main Dashboard 3-Column Grid -->
        <main class="dashboard-grid">
            <!-- Column 1: Workflow Nodes (Sequential Chain) -->
            <div class="panel workflow-card">
                <div class="panel-header">
                    <h3><i class="fa-solid fa-diagram-next"></i> Workflow Nodes</h3>
                    <span class="badge-count" id="node-count">4 Steps</span>
                </div>
                <div class="panel-body">
                    <div id="workflow-nodes-container" class="nodes-list">
                        <!-- Rendered dynamically by script.js -->
                    </div>
                </div>
            </div>

            <!-- Column 2: State Inspector / JSON Payload -->
            <div class="panel state-card">
                <div class="panel-header">
                    <h3><i class="fa-solid fa-code"></i> State Inspector</h3>
                    <span class="sub-text">Current Node Payload</span>
                </div>
                <div class="panel-body">
                    <div class="json-box">
                        <pre><code id="json-viewer">// Select a node or enter a prompt to view execution state</code></pre>
                    </div>
                </div>
            </div>

            <!-- Column 3: Live Agent Logs Output -->
            <div class="panel logs-card">
                <div class="panel-header">
                    <h3><i class="fa-solid fa-list-check"></i> Execution Logs</h3>
                    <button class="icon-btn" id="clear-logs" title="Clear Console"><i class="fa-solid fa-trash-can"></i></button>
                </div>
                <div class="panel-body">
                    <div id="logs-container" class="logs-console">
                        <div class="log-line sys"><span class="ts">[00:00:00]</span> Engine initialized. Waiting for user input.</div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
